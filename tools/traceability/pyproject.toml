[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "samd-traceability-mcp"
version = "0.1.0"
description = "Read-only requirement-to-test traceability checks for GitHub repositories via MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=1.0,<2", "httpx>=0.27,<1", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
samd-traceability-mcp = "samd_traceability_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/samd_traceability_mcp"]
