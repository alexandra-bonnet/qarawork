[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qarawork-audit-trail"
version = "0.1.0"
description = "Read-only Notion activity metadata and event-list consistency checks"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
qarawork-audit-trail = "qarawork_audit_trail.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qarawork_audit_trail"]
