[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qarawork-document-control"
version = "0.1.0"
description = "Read-only document revision assessment core for QARAWORK"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0,<2", "httpx>=0.27,<1", "cryptography>=50,<51"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/qarawork_document_control"]

[project.scripts]
qarawork-document-control = "qarawork_document_control.server:main"
