name: Python package tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - tools/traceability
          - tools/document-control
          - tools/audit-trail
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e "./${{ matrix.package }}[dev]"
      - name: Run tests
        run: python -m pytest "${{ matrix.package }}/tests" -q
      - name: Audit installed dependencies
        run: |
          python -m pip install --upgrade 'setuptools>=84.1.0' pip-audit
          python -m pip_audit --progress-spinner off
